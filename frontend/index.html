<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/studyquest-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/studyquest-icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/studyquest-icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#fffaf5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07080c" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Turn your lecture PDFs into quizzes. Earn XP, keep your streak, and remember it for the exam." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyQuest</title>

    <!-- Fonts: Geist (UI) and Geist Mono (numbers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap"
    />

    <!-- Set the theme before the page paints, so there is no flash. -->
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("theme");
        } catch (e) {}
        var system = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        document.documentElement.dataset.theme =
          saved === "light" || saved === "dark" ? saved : system;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
