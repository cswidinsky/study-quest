<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/studyquest-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/studyquest-icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/studyquest-icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Brand orange: the side stripe on Discord link previews (and the phone browser bar). -->
    <meta name="theme-color" content="#FF6B2C" />
    <meta name="description" content="Turn your lecture PDFs into quizzes. Earn XP, keep your streak, and remember it for the exam." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Link previews (Open Graph: Discord, iMessage, LinkedIn, Facebook…). URLs must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StudyQuest" />
    <meta property="og:title" content="StudyQuest" />
    <meta property="og:description" content="Turn your lecture PDFs into quizzes. Earn XP, keep your streak, and remember it for the exam." />
    <meta property="og:url" content="https://www.studyquest.co" />
    <meta property="og:image" content="https://www.studyquest.co/og-image.png" />
    <meta property="og:image:secure_url" content="https://www.studyquest.co/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="StudyQuest logo next to the line “Your notes, played as a game.”" />

    <!-- X (Twitter): the big image card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StudyQuest" />
    <meta name="twitter:description" content="Turn your lecture PDFs into quizzes. Earn XP, keep your streak, and remember it for the exam." />
    <meta name="twitter:image" content="https://www.studyquest.co/og-image.png" />
    <meta name="twitter:image:alt" content="StudyQuest logo next to the line “Your notes, played as a game.”" />
    <link rel="canonical" href="https://www.studyquest.co" />
    <title>StudyQuest</title>

    <!-- Fonts: Geist (UI) and Geist Mono (numbers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap"
    />

    <!-- Set the theme before the page paints, so there is no flash. -->
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("theme");
        } catch (e) {}
        var system = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        document.documentElement.dataset.theme =
          saved === "light" || saved === "dark" ? saved : system;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
